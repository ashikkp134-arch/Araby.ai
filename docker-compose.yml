# Compatible with docker-compose 1.25+ (Ubuntu 20.04) and Docker Compose V2.
# Usage:
#   cp backend/.env.example backend/.env   # set OPENAI_API_KEY + JWT secrets
#   docker-compose up -d --build
#   Open http://localhost

version: "3.3"

services:
  mongodb:
    image: mongo:7
    container_name: ai-workspace-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai_coding_workspace
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: ai-workspace-redis
    restart: unless-stopped
    # Prefer host Redis on 6379 for local uvicorn; compose backend uses the service network.
    # Uncomment if you need Redis published and nothing else is bound to 6379:
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  # Arize Phoenix — LLM trace UI (OpenTelemetry / OpenInference)
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: ai-workspace-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"
    volumes:
      - phoenix_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-workspace-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1
      APP_ENV: production
      COOKIE_SECURE: "false"
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: https://app.phoenix.arize.com/s/AI-Coding-Workspace/v1/traces
      OTEL_SERVICE_NAME: araby-codeai-backend
      GUARDRAILS_ENABLED: "true"
      GUARDRAILS_BLOCK_ON_INPUT: "true"
      GUARDRAILS_BLOCK_ON_OUTPUT: "true"
    depends_on:
      - mongodb
      - redis
      - phoenix

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-workspace-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
  phoenix_data:
